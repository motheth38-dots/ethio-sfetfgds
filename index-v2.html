.view{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;transition:transform .25s}
#chat{transform:translateX(100%);background:linear-gradient(160deg,#3d5566,#1f2b38)}
#chat.open{transform:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px}
.me{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#9aa;font-size:30px;flex:none}
.id{flex:1;min-width:0;line-height:1.2}
.id .u{font-weight:900;letter-spacing:.5px;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.id .n,.id .i{font-size:14px;cursor:pointer;color:#dfe6ee}
.icons{display:flex;gap:6px;font-size:20px}
.icons button{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.35)}
.search{margin:0 14px 8px;padding:10px 14px;border-radius:22px;background:var(--panel);display:flex;gap:8px;align-items:center}
.search input{flex:1;border:0;outline:0;background:none;color:var(--tx);font:inherit}
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 14px;background:var(--panel);scrollbar-width:none}
.st{flex:none;width:70px;text-align:center;font-size:12px}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(#35d08c,#3aa0ff,#35d08c);margin-bottom:4px}
.ring.none{background:none}
.ring div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;border:2px solid #182230;position:relative}
.plus{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#2f80ed;font-size:16px;line-height:22px;border:0!important}
.tabs{display:flex;gap:4px;margin:8px 10px;padding:6px;border-radius:26px;background:var(--panel);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:22px;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--sel);color:var(--acc)}
.tabs i{font-style:normal;background:#5b6677;color:#fff;border-radius:14px;padding:3px 10px;font-size:15px;min-width:28px;text-align:center}
.tabs button.on i{background:#5aa9ff;color:#0b1a2e}
.tabs svg{display:block}.tn{font-size:14px}
.sic{display:grid;place-items:center;flex:none}
.list{flex:1;overflow-y:auto;margin:0 10px;background:var(--panel);border-radius:14px 14px 0 0}
.row{display:flex;gap:12px;padding:12px 14px;align-items:center;width:100%;text-align:left}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;color:#fff}
.mid{flex:1;min-width:0}.mid b{display:block;font-size:16px}
.mid span{display:block;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{text-align:right;font-size:12px;color:var(--mut);flex:none}
.bd{display:inline-block;margin-top:4px;background:#3b82f6;color:#fff;border-radius:10px;min-width:20px;padding:1px 6px}
.fab{position:absolute;right:16px;bottom:96px;width:58px;height:58px;border-radius:18px;background:#fff;color:#111;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.nav{display:flex;background:rgba(10,14,20,.92);padding:8px 0 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
.nav button span{font-size:22px;padding:4px 20px;border-radius:16px}
.nav button.on{color:#fff}.nav button.on span{background:#2a2f36}
.ph{flex:1;display:grid;place-items:center;color:#dfe6ee;margin:0 10px;background:var(--panel);border-radius:14px 14px 0 0}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(10,14,20,.7)}
.ch .back{font-size:22px;padding:0 6px}.ch .av{width:40px;height:40px;font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:8px 12px;border-radius:14px;line-height:1.4;word-wrap:break-word}
.b small{display:block;font-size:11px;color:#b8c4d4;text-align:right;margin-top:2px}
.mine{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}
.their{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}
.typ{align-self:flex-start;color:var(--mut);font-size:13px}
form{display:flex;gap:8px;padding:8px 10px;background:rgba(10,14,20,.8)}
form input{flex:1;padding:11px 14px;border-radius:22px;border:0;background:#202b3b;color:var(--tx);font:inherit;outline:0}
form button{width:44px;height:44px;border-radius:50%;background:#2f80ed;color:#fff;font-size:18px}
[hidden]{display:none!important}
.set{flex:1;overflow-y:auto;padding-bottom:12px}
.sh{display:flex;align-items:center;gap:8px;padding:10px 14px}.sh span{flex:1}
.sh button{font-size:20px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.38)}
.sp{text-align:center;padding:0 14px 6px;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.sav{width:92px;height:92px;border-radius:50%;margin:0 auto 8px;background:#fff;color:#556;display:grid;place-items:center;font-size:38px;font-weight:700;position:relative;text-shadow:none}
.cam{position:absolute;right:-6px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:#2f9cf0;font-size:16px;line-height:34px;color:#fff}
.sp h2{margin:4px 0;font-size:24px;cursor:pointer}.sp p{margin:0;color:#e3e9f0;font-size:14px}.sp p span{cursor:pointer}
.res{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 14px 4px;padding:11px;border:1.5px solid rgba(255,255,255,.55);border-radius:26px;color:#3ddc97;font-weight:600;background:rgba(10,16,24,.6);width:calc(100% - 28px)}
.card{margin:10px 12px;background:var(--panel);border-radius:18px;padding:6px 0}
.si{display:flex;gap:14px;align-items:center;padding:11px 16px;width:100%;text-align:left}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.si b{display:block;font-size:17px;font-weight:500}.si span{display:block;color:var(--mut);font-size:14px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#0b1118;color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:5;white-space:nowrap}
.av{position:relative}
.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#35d08c;border:2px solid #182230}
.call{font-size:19px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.tk{color:#4aa3ff}
.cnt{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#35b36a;color:#fff;font-size:12px;line-height:18px;border:2px solid #182230}
.fab2{position:absolute;right:24px;bottom:166px;width:44px;height:44px;border-radius:50%;background:rgba(14,20,30,.9);color:#fff;font-size:19px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.nav button span{position:relative}
.nb{position:absolute;right:6px;top:-2px;background:#3b82f6;color:#fff;border-radius:10px;min-width:19px;height:19px;font-size:12px;font-style:normal;line-height:19px}
.sv{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;flex-direction:column}
.bars{display:flex;gap:4px;padding:12px 12px 6px}.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.bars i.on{background:#fff}
.svh{display:flex;align-items:center;gap:10px;padding:6px 14px}.svh .av{width:38px;height:38px;font-size:15px;background:rgba(0,0,0,.3)}.svh b{flex:1}.svh button{font-size:20px;width:38px;height:38px}
.svb{flex:1;display:grid;place-items:center;padding:24px;text-align:center;font-size:28px;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#newm{transform:translateX(100%);background:linear-gradient(160deg,#3d5566,#1f2b38)}
#newm.open{transform:none}
.list2{flex:1;overflow-y:auto;margin:0 10px;background:var(--panel);border-radius:14px 14px 0 0}
.crow{display:flex;gap:14px;align-items:center;padding:8px 16px;width:100%;text-align:left}
.crow b{display:block;font-size:17px}.crow span{display:block;font-size:15px}
.ls{color:var(--mut)}.on2{color:#4aa3ff}
.sec{color:#6ea8ff;font-weight:600;padding:12px 16px 6px}
.ch2{display:flex;align-items:center;padding:14px 18px 8px}
.ch2 h2{flex:1;margin:0;font-size:26px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ch2 button{font-size:18px;font-weight:700;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35)}
.csearch{margin:4px 14px 6px;padding:10px 14px;border-radius:24px;background:var(--panel);display:flex;gap:8px;align-items:center}
.csearch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font:inherit}

#sfp{position:absolute;left:0;right:0;bottom:0;z-index:80;background:#182230;border-radius:20px 20px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.5);max-height:72%;display:flex;flex-direction:column;gap:8px}
#sfp[hidden],#sfv[hidden],#bio_b[hidden]{display:none}
#sfp .sfh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#d4af37}
#sfp .sfh button,#sfp .sfq button{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08);margin-left:6px}
#sfl{overflow-y:auto;min-height:70px;max-height:210px;display:flex;flex-direction:column;gap:6px}
.sfm{padding:8px 12px;border-radius:14px;font-size:14px;max-width:88%;word-break:break-word}.sfm.me{align-self:flex-end;background:var(--out)}.sfm.a{align-self:flex-start;background:var(--in)}
.sfc{display:flex;gap:8px}.sfc button{padding:7px 16px;border-radius:12px;background:#2f80ed;font-weight:700}.sfc button+button{background:#5b6677}
#sfp .sfq{display:flex}
#sfp .sfr{display:flex;gap:8px}#sfp .sfr input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--bd);background:#202b3b;color:var(--tx);font:inherit;outline:0}
#sfp .sfr button{width:44px;border-radius:50%;background:#2f80ed;font-size:18px}#sfmic.on{background:#e0475b!important;animation:sfp 1s infinite}
@keyframes sfp{50%{transform:scale(1.12)}}
#sfv{position:absolute;top:0;right:0;bottom:0;left:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#sfv video{width:100%;max-height:72%;object-fit:cover;transform:scaleX(-1)}
#sfv .sfc button{font-size:16px;padding:12px 22px}
#sfcv{position:absolute;right:14px;top:70px;width:112px;border-radius:14px;z-index:3;transform:scaleX(-1);border:2px solid #fff}

/* Fixed insignia and voice-assistant refinements */
#sf-brand{position:absolute;z-index:65;right:8px;bottom:calc(7px + env(safe-area-inset-bottom,0px));width:64px;height:52px;object-fit:contain;border-radius:8px;background:#f5f5f5;border:1px solid rgba(212,175,55,.75);box-shadow:0 3px 14px #0008;pointer-events:none}
.nav{padding-right:76px!important}
#sfai{box-shadow:0 0 0 4px rgba(212,175,55,.12),0 0 24px rgba(80,155,255,.38);animation:sfOrbPulse 3s ease-in-out infinite}
#sfai:before{content:"";display:block;width:25px;height:25px;margin:auto;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 5%,#b9e8ff 13%,#5d9bff 36%,#6654db 62%,#151a3d 78%);box-shadow:0 0 15px #78baff;}
#sfai:after{content:"";position:absolute;top:7px;right:7px;bottom:7px;left:7px;border:1px solid #d6edff99;border-radius:50%;animation:sfOrbRing 4s linear infinite}
@keyframes sfOrbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sfOrbRing{to{transform:rotate(360deg)}}
#sfp .sfh{align-items:center}
#sfp .sfh b:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#59dca0;box-shadow:0 0 9px #59dca0}
#sfp .sfr #sfmic{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#4e8dff,#7357e8);box-shadow:0 0 16px #4e8dff66}
#sfp .sfr #sfmic.on{background:#d9465f;box-shadow:0 0 0 7px #d9465f33;animation:sfOrbPulse 1s infinite}
#em .lkc input{width:100%;margin:5px 0}
#em_mode{margin-top:8px;border:1px solid var(--bd);border-radius:10px;padding:10px}
@media(max-width:360px){#sf-brand{width:52px;height:43px;right:5px}.nav{padding-right:62px!important}}

/* v18: assistant at former insignia slot, refreshed toolbar and media controls */
#sf-brand{display:none!important}
#sfai{right:8px!important;bottom:calc(5px + env(safe-area-inset-bottom,0px))!important;width:64px!important;height:52px!important;border-radius:12px!important;z-index:76!important;background:linear-gradient(145deg,#101722,#26384b)!important;border:1.5px solid #d4af37!important;display:grid;place-items:center;box-shadow:0 3px 14px #0009,0 0 16px #4e8dff44!important}
#sfai:before{width:27px!important;height:27px!important}
#sfai:after{top:5px!important;right:5px!important;bottom:5px!important;left:5px!important}
#sfai[aria-label]{cursor:pointer}
.nav{padding-right:78px!important;min-height:52px;align-items:center}
.nav button{min-width:0}
.nav button span{padding-left:10px!important;padding-right:10px!important}
.fab{z-index:30;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(145deg,#fff,#dce8ff);color:#102033}
.fab[aria-label="new chat"]{font-size:0}
.fab[aria-label="new chat"]:before{content:"＋";font-size:31px;line-height:1}
.top{min-height:66px;padding:8px 10px;gap:9px;background:linear-gradient(100deg,rgba(16,23,33,.92),rgba(45,62,72,.78));border-top:3px solid #111;box-shadow:0 3px 12px #0004}
.me{width:46px;height:46px;font-size:24px;box-shadow:0 0 0 2px #ffffff44}
.id .u{font-size:15px;white-space:nowrap}
.id .n,.id .i{font-size:12px}
.icons{gap:4px}
.icons button{width:34px;height:36px;border-radius:11px;background:rgba(0,0,0,.28)}
.search{margin:5px 10px 7px;padding:8px 12px;min-height:42px;border:1px solid rgba(255,255,255,.1);background:rgba(17,27,40,.92)}
.search .sic{width:25px;height:25px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.search .sic img{width:21px;height:21px;object-fit:contain;filter:invert(1)}
.tabs{margin:5px 8px 7px;padding:4px;background:rgba(16,24,35,.94);border:1px solid rgba(255,255,255,.07);gap:3px}
.tabs button{padding:7px 9px;gap:5px;flex:1;justify-content:center}
.tabs button .tn{font-size:11px;display:inline-block}
#sfai:focus-visible,.fab:focus-visible,.icons button:focus-visible{outline:2px solid #f4d36b;outline-offset:2px}
#bsend.sf-mic-btn{display:grid;place-items:center;background:linear-gradient(145deg,#397eea,#6957e8);box-shadow:0 0 0 3px #4e8dff22}
#bsend .sf-mic-img{width:29px;height:29px;object-fit:contain;display:block}
#bsend.sf-recording{background:#df3f56;animation:sfRecPulse .9s infinite}
#bsend.sf-recording .sf-stop{width:15px;height:15px;border-radius:3px;background:#fff;display:block}
@keyframes sfRecPulse{0%,100%{box-shadow:0 0 0 0 #df3f5655;transform:scale(1)}50%{box-shadow:0 0 0 7px #df3f5622;transform:scale(1.04)}}
#rec{align-items:center}
#rec .sf-rec-icon{width:30px;height:30px;object-fit:contain;background:#202b3b;border-radius:50%;padding:4px;animation:sfRecPulse .9s infinite}
#hvid{width:42px;height:46px;display:grid;place-items:center;border-radius:14px;margin-right:2px;background:#fff;overflow:hidden}
#hvid img{width:35px;height:35px;object-fit:contain}
#sfq1{min-width:40px;min-height:40px}
#sfq1 img{width:24px;height:24px;object-fit:contain;vertical-align:middle}
#tdevices{display:grid;place-items:center}
#tdevices svg{width:20px;height:20px}
#sfp .sfh b{font-size:13px}
@media(max-width:360px){
  #sfai{width:54px!important;height:45px!important;right:5px!important}
  .nav{padding-right:64px!important}
  .tabs button{padding:6px 5px}
  .tabs button .tn{font-size:10px}
  .top{gap:6px;padding-left:8px;padding-right:8px}
  .me{width:40px;height:40px}
}


/* v19: align search with identity, remove device shortcut, refine AI voice controls */
.top{display:flex!important;align-items:center!important;gap:9px!important;flex-wrap:nowrap!important;}
.top .id{flex:0 1 auto!important;min-width:0!important;max-width:38%!important;}
.top .id .n{font-size:clamp(11px,3.2vw,16px)!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
.top .id .u,.top .id .i{font-size:clamp(10px,2.8vw,13px)!important;line-height:1.15!important;}
.top .search{position:static!important;flex:1 1 110px!important;min-width:0!important;width:auto!important;margin:0!important;padding:5px 8px!important;min-height:36px!important;border-radius:24px!important;display:flex!important;align-items:center!important;gap:5px!important;background:rgba(17,27,40,.92)!important;border:1px solid rgba(255,255,255,.15)!important;}
.top .search .sic{width:26px!important;height:26px!important;flex:0 0 26px!important;background:#fff!important;color:#111!important;border-radius:50%!important;display:grid!important;place-items:center!important;font-size:25px!important;line-height:1!important;}
.top .search input{width:100%!important;min-width:0!important;font-size:12px!important;padding:0!important;}
.top .icons{flex:0 0 auto!important;gap:0!important;}
.top .icons button{width:30px!important;height:34px!important;}
/* There is no device shortcut in the top toolbar; keep device management inside Settings. */

#sfp .sfh{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
#sfp .sfh>b{flex:1;min-width:0;}
#sfsp{min-width:44px;min-height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;}
#sfmic{min-width:58px;min-height:58px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#397eea,#6957e8);box-shadow:0 0 0 3px #4e8dff22;transition:transform .15s,box-shadow .15s;}
#sfmic.on{background:#df3f56!important;animation:sfMicListening .85s ease-in-out infinite;box-shadow:0 0 0 0 #df3f5677!important;}
#sfmic.on:after{content:"";position:absolute;width:68px;height:68px;border:2px solid #ff5a70;border-radius:50%;animation:sfMicRipple 1.1s ease-out infinite;pointer-events:none;}
#sfmic{position:relative;}
#sfmic:focus-visible,#sfsp:focus-visible{outline:2px solid #f4d36b;outline-offset:3px;}
@keyframes sfMicListening{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes sfMicRipple{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media(max-width:420px){.top{gap:6px!important;padding-left:7px!important;padding-right:7px!important}.top .me{width:38px!important;height:38px!important;flex:0 0 38px!important}.top .id{max-width:31%!important}.top .search{padding:4px 6px!important;min-height:33px!important}.top .search .sic{width:22px!important;height:22px!important;flex-basis:22px!important;font-size:21px!important}.top .search input{font-size:11px!important}.top .icons button{width:25px!important}}

<script id="sf-voice-search-integration">
(function(){
  var btn=document.getElementById('sfSearchVoice'), input=document.getElementById('q');
  if(!btn||!input)return;
  var rec=null, active=false;
  function status(msg){var s=document.getElementById('status-text');if(s)s.textContent=msg;}
  function lang(){var l=document.getElementById('sflg');return l&&(/አማ/.test(l.textContent)||/am/i.test(l.textContent))?'am-ET':'en-US';}
  function reset(){active=false;rec=null;btn.classList.remove('listening');btn.textContent='🎙️';btn.setAttribute('aria-label','Search by voice');btn.title='Search by voice';}
  btn.addEventListener('click',function(){
    if(active&&rec){try{rec.stop()}catch(e){};return;}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){status('የድምፅ ፍለጋ በዚህ አሳሽ አይደገፍም። / Voice search is not supported; type your search.');return;}

      rec.onstart=function(){active=true;btn.classList.add('listening');btn.textContent='⏹️';btn.setAttribute('aria-label','Stop voice search');btn.title='Listening…';status(lang()==='am-ET'?'እያዳመጥኩ ነው… ይናገሩ።':'Listening… speak now.');};

      rec.onerror=function(e){var msg=e&&e.error==='not-allowed'?'ማይክሮፎን ፈቃድ ይፍቀዱ። / Allow microphone access.':e&&e.error==='no-speech'?'ድምፅ አልተሰማም። / No speech detected.':'የድምፅ ፍለጋ አልተሳካም። / Voice search failed.';status(msg);reset();};
      rec.onend=function(){reset();if(input.value.trim())status(lang()==='am-ET'?'የፍለጋ ውጤቶች ተዘምነዋል።':'Search results updated.');};
      rec.start();
    }catch(e){reset();status('ማይክሮፎኑን መክፈት አልተቻለም። / Could not start microphone.');}
  });
})();

<script id="sf-all-media-compat">
(function(){
  var $=function(id){return document.getElementById(id)};
  if(!$("fdoc"))return;
  // Permit common media and document types while blocking executable/script formats.
  var extMime={
    pdf:"application/pdf",txt:"text/plain",zip:"application/zip",doc:"application/msword",
    docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",
    mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav",ogg:"audio/ogg",opus:"audio/ogg",
    webm:"video/webm",mp4:"video/mp4",mov:"video/quicktime",mkv:"video/x-matroska",
    csv:"text/csv",rtf:"application/rtf",json:"application/json"
  };
  Object.keys(extMime).forEach(function(x){
    if(typeof MIMEEXT!=="undefined")MIMEEXT[extMime[x]]=x;
    if(typeof MIMEOK!=="undefined")MIMEOK[extMime[x]]=1;
  });
  if(typeof MIMEEXT!=="undefined"){
    MIMEEXT["audio/aac"]="aac";MIMEEXT["audio/wav"]="wav";MIMEEXT["audio/quicktime"]="mov";
    MIMEEXT["video/quicktime"]="mov";MIMEEXT["video/x-matroska"]="mkv";MIMEEXT["text/csv"]="csv";
    MIMEEXT["application/msword"]="doc";MIMEEXT["application/vnd.ms-excel"]="xls";
    MIMEEXT["application/vnd.ms-powerpoint"]="ppt";MIMEEXT["application/rtf"]="rtf";MIMEEXT["application/json"]="json";
  }
  $("fdoc").onchange=function(e){
    var f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    if(f.size>15e6){toast("File too large (max 15 MB)");return}
    var n=clean(f.name,80)||"file",x=(n.split(".").pop()||"").toLowerCase();
    if(/\.(exe|apk|bat|cmd|com|scr|msi|js|jse|vbs|ps1|sh|jar|html?|svg|php|py|dll|so)$/i.test(n)){
      toast("This file type is blocked for safety");return;
    }
    var mime=extMime[x]||f.type||"application/octet-stream";
    if(!/^[a-z0-9]{1,8}$/i.test(x)){toast("Unsupported file extension");return}
    if(typeof MIMEEXT!=="undefined")MIMEEXT[mime]=x;
    if(typeof MIMEOK!=="undefined")MIMEOK[mime]=1;
    sendMedia("file",f,{name:n,mime:mime});
  };
  // Render playable audio/video attachments as players; keep other files downloadable.
  var previousMsgs=msgs;
  msgs=function(){
    previousMsgs();
    if(typeof cur==="undefined"||cur===null)return;
    var c=chats[cur];if(!c)return;
    Array.prototype.forEach.call($("msgs").querySelectorAll(".b[data-mi]"),function(el){
      var m=c.m[+el.dataset.mi];if(!m||m[3]!=="file"||!m.url||el.querySelector("audio,video,a[data-media-download]"))return;
      var mime=String(m.mime||"").toLowerCase(),small=el.querySelector("small");
      if(mime.indexOf("video/")===0){
        var v=document.createElement("video");v.controls=true;v.playsInline=true;v.preload="metadata";v.src=m.url;
        v.style.cssText="display:block;margin:6px 0;max-width:100%;max-height:320px;border-radius:10px";
        el.insertBefore(v,small);
      }else if(mime.indexOf("audio/")===0){
        var a=document.createElement("audio");a.controls=true;a.preload="none";a.src=m.url;
        a.style.cssText="display:block;margin:6px 0;max-width:100%";el.insertBefore(a,small);
      }else{
        var l=document.createElement("a");l.href=m.url;l.download=clean(m[4],80)||"file";l.dataset.mediaDownload="1";
        l.textContent="⬇ Save file";l.style.cssText="display:block;margin:4px 0;color:inherit;text-decoration:underline";el.insertBefore(l,small);
      }
    });
  };
  // Update attachment picker label to communicate broader support.
  var docButton=$('att')&&$('att').querySelector('[data-k="doc"]');
  if(docButton){var span=docButton.querySelector('span');docButton.setAttribute("title","Attach documents, audio, video, and other files (max 15 MB)");}
})();

<div id="sf-media-rec" hidden><span id="sf-media-status">Recording… 0:00</span><button id="sf-media-cancel" type="button">Cancel</button><button id="sf-media-stop" type="button">Stop &amp; send</button></div>
<script id="sf-media-recording">
(function(){
 var stream=null, recorder=null, chunks=[], mode="", started=0, ticker=null, cancelled=false, busy=false;
 var $=function(id){return document.getElementById(id)};
 function status(){var sec=Math.floor((Date.now()-started)/1000);$("sf-media-status").textContent=(mode==="video"?"Recording video… ":"Recording voice… ")+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}
 function cleanup(){if(ticker)clearInterval(ticker);ticker=null;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}recorder=null;chunks=[];busy=false;$("sf-media-rec").hidden=true}
 window.startMediaCapture=async function(which){
   if(busy){toast("A recording is already active");return}
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Recording needs microphone/camera permission and a supported HTTPS browser");return}
   if(location.protocol!=="https:"&&location.hostname!=="localhost"&&location.protocol!=="file:"){toast("Open the app over HTTPS to record");return}
   mode=which;cancelled=false;busy=true;chunks=[];
   try{
     stream=await navigator.mediaDevices.getUserMedia(which==="video"?{audio:true,video:{facingMode:"environment"}}:{audio:true});
     if(!busy){stream.getTracks().forEach(function(t){t.stop()});return}
     var candidates=which==="video"?["video/webm;codecs=vp8,opus","video/webm","video/mp4"]:["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
     var mime=candidates.find(function(t){return MediaRecorder.isTypeSupported(t)})||"";
     recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
     recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
     recorder.onerror=function(){toast("Recording failed");cleanup()};
     recorder.onstop=function(){
       var rec=recorder, blob=new Blob(chunks,{type:(rec&&rec.mimeType)||mime||(which==="video"?"video/webm":"audio/webm")});
       var dur=Math.max(1,Math.round((Date.now()-started)/1000)), kind=mode;
       var type=blob.type.split(";")[0], ext=type==="audio/mp4"?"m4a":type==="audio/ogg"?"ogg":type==="audio/wav"?"wav":type==="audio/aac"?"aac":type==="video/mp4"?"mp4":type==="video/quicktime"?"mov":type==="video/webm"?"webm":type==="audio/mpeg"?"mp3":type==="audio/webm"?"webm":"";
       if(cancelled){cleanup();return}
       if(!blob.size){cleanup();toast("No recording captured");return}
       if(kind==="audio"&&blob.size>5e6){cleanup();toast("Voice recording too large (max 5 MB)");return}
       if(kind==="video"&&blob.size>15e6){cleanup();toast("Video too large (max 15 MB)");return}
       var mimeMap={"audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/wav":"wav","audio/aac":"aac","video/webm":"webm","video/mp4":"mp4","video/quicktime":"mov"};
       if(typeof MIMEEXT!=="undefined")MIMEEXT[type]=mimeMap[type]||ext;
       if(typeof MIMEOK!=="undefined")MIMEOK[type]=1;
       cleanup();
       if(kind==="audio")sendMedia("voice",blob,{mime:type,name:"Voice message."+ (mimeMap[type]||"webm"),dur:dur});
       else sendMedia("file",blob,{mime:type,name:"Video_"+Date.now()+"."+(mimeMap[type]||"webm"),dur:dur});
     };
     started=Date.now();$("sf-media-rec").hidden=false;status();ticker=setInterval(status,500);
     recorder.start(500);
   }catch(err){cleanup();toast(err&&err.name==="NotAllowedError"?"Microphone/camera permission denied":("Could not start recording: "+(err.message||"permission or device error")))}
 };
 $("sf-media-stop").onclick=function(){if(recorder&&recorder.state!=="inactive")recorder.stop()};
 $("sf-media-cancel").onclick=function(){cancelled=true;if(recorder&&recorder.state!=="inactive")recorder.stop();else cleanup()};
 window.addEventListener("pagehide",function(){cancelled=true;if(recorder&&recorder.state!=="inactive")try{recorder.stop()}catch(e){}if(stream)stream.getTracks().forEach(function(t){t.stop()});cleanup()});
})();
</script>
